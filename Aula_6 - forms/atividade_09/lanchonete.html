<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de uma Lanchonete</title>
</head>
<body>
    <form method="post" action="" onsubmit="alert('Pedido registrado com sucesso!')">

        <h2>Formulário de Pedido</h2>
        <p>Insira os dados para o pedido</p>

        <label>Insira o nome:</label> <br>
        <input type="text" name="login" placeholder="Insira o nome" required>
        <br> <br>
        <label>Insira o email:</label><br>
        <input type="text" name="email" placeholder="Insira o email">
        <br> <br>

        <p>Tipo do pedido:</p>
        <input type="radio"
               id="local"
               name="atendimento"
               value="local"
               >
        <label for="local">Consumir no local</label>
        <br>
        <input type="radio"
               id="retirada"
               name="atendimento"
               value="retirada"
               >
        <label for="retirada">Retirada no local</label>
        <br>
        <input type="radio"
               id="entrega"
               name="atendimento"
               value="entrega"
               >
        <label for="entrega">entrega</label>
        <br> <br>

         <p>Produtos:</p>
        <input type="checkbox"
               id="hamburguer"
               name="itens"
               value="hamburguer"
               >
        <label for="hamburguer">Hambúrguer</label>
        <br>
        <input type="checkbox"
               id="cachoro-quente"
               name="itens"
               value="cachoro-quente"
               >
        <label for="cachoro-quente">Cachoro-quente</label>
        <br>
        <input type="checkbox"
               id="pizza"
               name="itens"
               value="pizza"
               >
        <label for="pizza">Pizza</label>
        <br>
        <input type="checkbox"
               id="frita"
               name="itens"
               value="frita"
                >
        <label for="frita">Batata frita</label>
        <br>
        <input type="checkbox"
               id="refrigerante"
               name="itens"
               value="refrigerante"
               >
        <label for="refrigerante">Refrigerante</label>
        <br>
        <input type="checkbox"
               id="Suco"
               name="itens"
               value="Suco"
                >
        <label for="Suco">Suco</label>
        <br> <br>

        <label for="dif">Nível de dificuldade da atividade, de 0 a 10</label>
        <input type="number" id="dif" name="dif" min="0" max="15">
        <br> <br>

        <label>Data e hora do pedido</label><br>
        <input type="date" name="data" >
        <br>
        <input type="time" name="horario" >
        <br> <br>
    </form>
</body>
</html>
