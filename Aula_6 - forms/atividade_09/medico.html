<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de atendimento médico</title>
</head>
<body>
    <form method="post" action="" onsubmit="alert('Solicitação de agendamento enviada!')">
    
    <h2>Agendamento</h2>

    <label>Insira o nome paciente:</label> <br>
    <input type="text" name="login" placeholder="Insira o nome completo" required>
    <br> <br>
    <label>Insira o email:</label><br>
    <input type="text" name="email" placeholder="Insira o email">
    <br> <br>
    <label>Data de nascimeno:</label><br>
    <input type="date" name="nascimeno" required>
    <br> <br>
    <label>Data e horário desejado para a consulta</label><br>
    <input type="date" name="data" required>
    <br>
    <input type="time" name="horario" required>
    <br> <br>

    <p>Tipo de atendimento:</p>
        <input type="radio"
               id="consulta"
               name="atendimento"
               value="consulta"
               required>
        <label for="consulta">Consulta de rotina</label>
        <br>
        <input type="radio"
               id="retorno"
               name="atendimento"
               value="retorno"
               required>
        <label for="retorno">Retorno</label>
        <br>
        <input type="radio"
               id="exame"
               name="atendimento"
               value="exame"
               required>
        <label for="exame">Exame</label>
        <br>
        <input type="radio"
               id="prioritario"
               name="atendimento"
               value="prioritario"
               required>
        <label for="prioritario">Atendimento prioritário</label>
        <br> <br>

        <label for="dor">Nivel de dor ou desconforto:</label>
        <input type="range" id="dor" name="dor" min="0" max="10">
        <br> <br>

        <label>Descrição dos dintomas</label><br>
        <input type="text" name="descriao" placeholder="Insira a descrição dos sintomas" required>
        <br> <br>

        <label>Anexar exames</label>
        <input type="file" name="exame" multiple>
        <br> <br>

        <input type="radio"
               id="autorizacao"
               name="agendamento"
               value="autorizacao"
               required>
        <label for="autorizacao">Autorizo o uso dos meus dados para fins de agendamento</label>
        <br> <br>

         

    </form>
</body>
</html>
