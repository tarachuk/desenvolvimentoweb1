<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meios de transporte</title>
</head>
<body>
    
    <form method="post" action="" onsubmit="alert('obrigado por participar da pesquisa!')">
        <br>

        <h2>Pesquisa sobre meios de transporte</h2>

        <label>Insira o seu nome:</label><br> 
        <input type="text" name="nome" placeholder="Insira seu nome" required>
        <br> <br>
        <label>Insira sua data de nascimento</label><br>
        <input type="date" name="nascimento">
        <br> <br>

        <p>Meios de transporte utilizado:</p>
        <input type="checkbox" name="veiculo1" value="bicicleta">
        Eu tenho uma bicicleta<br>
        <input type="checkbox" name="veiculo2" value="carro">
        Eu tenho um carro<br>
        <input type="checkbox" name="veiculo3" value="moto">
        Eu tenho uma moto<br>
        <input type="checkbox" name="veiculo4" value="onibus">
        Eu ando de ônibus<br>
        <input type="checkbox" name="veiculo5" value="aplicativo de transporte">
        Eu uso aplicativo<br>
        <input type="checkbox" name="veiculo6" value="caminhada">
        Eu faço caminhada<br> <br>

        <label for="quantity">Qual a quantidade de veículos você possui:</label>
        <input type="number" id="quantity" name="quantity" min="0" max="5">
        <br> <br>
        <label for="sat">Nivel de satisfação com o transporte público:</label>
        <input type="range" id="sat" name="sat" min="0" max="10">
        <br> <br>

        <label>Comentário sobre o trânsito da cidade</label>
        <input type="text" name="comentario" placeholder="Insira um comentario" required>
        <br> <br>

        <input type="submit">

    </form>
</body>
</html>
